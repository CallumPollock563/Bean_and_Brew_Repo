<body>

            <div class="block two"></div>
            <div class="block one"></div>
        </div>

        <div class="transition-row row-2">
            <div class="block one"><img src="logoLeft.png" alt="logoLeft"></div>
            <div class="block two"></div>
            <div class="block one"><img src="midLogo.png" alt="midLogo"></div>
            <div class="block two"></div>
            <div class="block one"><img src="logoRight.png" alt="logoRight"></div>
        </div>

    </div>  




    



    <section id="header">
        <h2 style="display:none;">Header Navigation</h2>
        
        <nav class="navbar">
            <div class="nav-left">
                <a href="index.html"><img src="logo.png" alt="Logo"></a>
            </div>

            <div class="nav-center">
                <a href="index.html"><img src="midLogo.png" alt="Center Image"></a>
            </div>

            <div class="nav-right">

            <a href="Menu.html" class="nav-btn">Menu</a>

            <a href="Contact.html" class="nav-btn">
                <img src="phone.png" alt="phone">
            </a>

            <a href="Contact.html" class="nav-btn">

            </a>

        </div>
        </nav>

        <div class="outline"></div>

    </section>


    <section>
        <h2 style="display:none;">Side Menu</h2>



    
        <nav class="menu-box">
            
                
               
            <a href="index.html
            "><p>Home</p></a>
            <a href="Menu.html"><p>Menu</p></a>
            <a href="Allergens.html"><p>Allergens</p></a>
            <a href="#contacts"><p class="menu-link active">CONTACTS</p></a>
            <a href="#booking"><p class="menu-link">BOOKING</p></a>
            <a href="About.html"><p class="menu-link">About Us</p></a>
        </nav>
            
    </section>



    

    


    <main> 
            
        <h1 id="contacts">CONTACTS</h1>

        <section class="mainsection">
            <h2 style="display:none;">Contacts</h2>
            
            <div class="mid">
                
                

                <div class="contact-box">
                    <p><strong>Phone number</strong><br>+1234567890</p>
                    <p><strong>Email address</strong><br>beanandbrew@email.com</p>
                </div>
            </div>

            <div class="right">
                <h2>find us:</h2>

                <div class="map-box">
                    <iframe
                    src="https://www.google.com/maps?q=BeanandBrew&output=embed"
                    
                    style="border:0;"
                    
                    loading="lazy">
                    </iframe>
                </div>
            </div>


        </section>

        <section class="mainsection" >
            <h2 style="display:none;">Booking Fourm</h2>
            
            <div>

                <h1 id="booking">BOOKING</h1>
            
                <div class="booking-form">

                

                    <div class="booking-form-top">
                        <input type="text" id="name" placeholder="Full Name">
                        <input type="email" id="email" placeholder="Email">

                        <textarea placeholder="Description"></textarea>
                    </div>

                    <div class="form-row">
                        <label>Date</label>
                        <div class="form-innerrow">
                            <input type="date" id="date">
                            <input type="time" id="time">
                            
                            
                            
                        </div>
                        

                        <button class="submit-btn" onclick="submitForm()">SUBMIT</button>
                    </div>
                    <p id="confirmation" style="display:none; color: green; font-weight: bold;">
    Booking request sent!
    </p>

                        
                        
                        
                    </div>
                </div>


            </section>








            
        </main>
        
        <script>
        let lastScrollTop = 0;
        const header = document.getElementById("header");

        window.onscroll = function () {
            let currentScroll = window.pageYOffset || document.documentElement.scrollTop;

            if (currentScroll > lastScrollTop) {
                header.style.transform = "translateY(-100%)";
            } else {
                header.style.transform = "translateY(0)";
            }

            lastScrollTop = currentScroll;
        };
    </script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="transition.js"></script>

    <script>
        function submitForm() {
            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const date = document.getElementById("date").value;
            const time = document.getElementById("time").value;

            
            if (!name || !email || !date || !time) {
                alert("Please fill in all required fields (Name, Email, Date, Time).");
                return;
            }

            
            if (!email.includes("@") || !email.includes(".")) {
                alert("Please enter a valid email address.");
                return;
            }

            
            document.getElementById("confirmation").style.display = "block";

            setTimeout(() => {
            confirmation.style.display = "none";
            }, 1000);   

            
            
        }
    </script>
    <script>
const sections = document.querySelectorAll("h1[id]");
const links = document.querySelectorAll(".menu-link");

const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        const id = entry.target.id;

        links.forEach(link => {
            const href = link.parentElement.getAttribute("href");

            if (href === "#" + id) {
                if (entry.isIntersecting) {
                    link.classList.add("active");
                } else {
                    link.classList.remove("active");
                }
            }
        })
    });
}, {
    threshold: 0.2
});

sections.forEach(section => observer.observe(section));
</script>
</body>

</Html>
